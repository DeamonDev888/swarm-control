# cargo-deny : advisories RustSec, licences, sources.
# Lancé par la CI (`cargo deny check`) et par scripts/verify.sh s'il est installé.

[advisories]
version = 2
yanked = "deny"
# `paste` n'est plus maintenu (RUSTSEC-2024-0436) : dépendance transitive de ratatui,
# sans impact connu. À retirer au prochain bump de ratatui s'il lâche cette dépendance.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
version = 2
# Liste minimale : celles réellement présentes dans l'arbre de dépendances.
# Une nouvelle dépendance sous une autre licence fait échouer la CI : à décider.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
