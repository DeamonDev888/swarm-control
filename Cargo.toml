[package]
name = "swarm-control"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Instancie des agents IA persistants via LiteMCP en Rust. Chaque agent créé = 1 profil et 1 exécutable : il vit, se souvient et communique avec ses pairs. Compatible Hermes (natif), Claude Code, Antigravity, grokbot, opencode, Kilo/Cline, OpenClaw, et extensible à tout runner CLI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/DeamonDev888/swarm-control"
homepage = "https://github.com/DeamonDev888/swarm-control"
documentation = "https://docs.rs/swarm-control"
readme = "README.md"
keywords = ["mcp", "agents", "claude-code", "hermes", "orchestration"]
categories = ["command-line-utilities", "development-tools"]
# Hors paquet publié : CI, outillage de release, documentation de travail, médias lourds.
# `assets/templates/` (modèles d'agents) et `assets/classes/*.svg` (logos, icônes) restent dans
# le paquet : la bibliothèque les embarque par `include_str!` (PLAN §4.1, §4.8).
exclude = [
    ".github",
    "scripts",
    "docs",
    "assets/*.png",
    "assets/*.jpg",
    "assets/pixel",
    "assets/classes/*.png",
    "assets/classes/*.jpg",
    "install.sh",
    "install.ps1",
]

[lib]
name = "swarm_control"
path = "src/lib.rs"

[[bin]]
name = "swarm-control"
path = "src/main.rs"

[features]
# La TUI n'est utile qu'au binaire : la bibliothèque s'importe avec
# `default-features = false` pour rester légère (voir PLAN §3.5).
default = ["tui"]
tui = ["dep:ratatui"]

[dependencies]
litemcp = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TUI (feature `tui`) : ratatui synchrone, crossterm réexporté.
ratatui = { version = "0.29", optional = true, default-features = false, features = ["crossterm"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
strip = true
lto = "fat"
codegen-units = 1

# `cargo binstall swarm-control` : les archives de la release GitHub portent
# `swarm-control-v<version>-<cible>.tar.gz` (`.zip` sous Windows) et contiennent
# le binaire dans un dossier du même nom (voir `.github/workflows/release.yml`).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# docs.rs : la documentation de la bibliothèque, TUI comprise.
[package.metadata.docs.rs]
all-features = true
