[package]
name = "overmind-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "OverMind en Rust : orchestrateur d'agents persistants (Claude Code, Hermes) servi en MCP par LiteMCP."
license = "MIT"
publish = false

[[bin]]
name = "overmind"
path = "src/main.rs"

[dependencies]
litemcp = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
