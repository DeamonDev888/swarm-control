# Release — pipeline canonique de publication d'une version.
#
# Déclenché par un tag `vX.Y.Z` (ou à la main, pour republier : voir docs/RELEASE.md).
# Quatre jobs séquentiels ; chacun court-circuite le suivant :
#   1. `verify`         — cohérence des versions (tag ↔ Cargo.toml ↔ Cargo.lock ↔ CHANGELOG)
#                         PUIS gate qualité : fmt, clippy strict, tests, doc, paquet, cargo-deny ;
#   2. `publish`        — crates.io, IDEMPOTENT (200/404/autre distingués) ;
#                         jeton : secret `CARGO_REGISTRY_TOKEN`, sinon OIDC (trusted publishing) ;
#   3. `github-release` — release GitHub, corps extrait de la section `## [X.Y.Z]` du CHANGELOG ;
#   4. `binaries`       — binaires Linux x86_64/aarch64, macOS arm64/x86_64, Windows x86_64 :
#                         archives (.tar.gz/.zip) ET exécutables nus, chacun avec son SHA-256,
#                         plus l'exécutable recopié sous nom fixe sans version
#                         (permalien releases/latest/download/<nom>).
#
# L'ordre est voulu : la release GitHub n'existe QUE si le crate est publié (une
# publication crates.io est irréversible, une release GitHub se corrige).
# Seuls `publish` (id-token) et `github-release` / `binaries` (contents: write)
# élèvent leurs permissions ; tout le reste est en lecture seule.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex. 0.1.0) — vide : le tag courant, sinon Cargo.toml'
        required: false
        type: string

permissions:
  contents: read

# Les runs de publication sont sérialisés ; avec l'idempotence, cela écarte toute
# publication en double d'une même version.
concurrency:
  group: publication
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Vérifier (cohérence des versions + gate qualité)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.coherence.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@98b24ef8830c90613ec3b57343df3abde2b66e56 # cargo-deny
        with:
          tool: cargo-deny

      # Cohérence AVANT le gate lourd : un tag incohérent échoue en secondes.
      - name: Cohérence des versions (tag/input ↔ Cargo.toml ↔ Cargo.lock ↔ CHANGELOG)
        id: coherence
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          V=$(bash scripts/release-check.sh "$VERSION_INPUT" | sed -n 's/^version=//p' | tail -1)
          if [ -z "$V" ]; then
            echo "cohérence non résolue — abandon avant tout test et toute publication"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version à publier : $V"

      - name: Gate qualité (fmt, clippy, tests, doc, paquet, cargo-deny)
        run: bash scripts/verify.sh

  publish:
    name: Publier sur crates.io
    needs: verify
    runs-on: ubuntu-latest
    # `id-token: write` sert uniquement à l'échange OIDC crates.io (jeton
    # éphémère) et reste confiné à CE job.
    permissions:
      contents: read
      id-token: write
    env:
      # Voie 1 : le secret `CARGO_REGISTRY_TOKEN` s'il existe.
      # Voie 2 : trusted publishing crates.io (OIDC) quand il est absent.
      HAS_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Ce job est le seul à écrire sur crates.io : il revalide lui-même la
      # cohérence, sans dépendre de l'ordre des jobs ni d'un output recopié.
      - name: Cohérence des versions avant publication
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: bash scripts/release-check.sh "$VERSION_INPUT" >/dev/null

      - name: Jeton crates.io par OIDC (aucun secret configuré)
        id: auth
        if: env.HAS_REGISTRY_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publier (idempotent, erreurs réseau non masquées)
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.HAS_REGISTRY_TOKEN == 'true' && secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: bash scripts/publish.sh "${{ needs.verify.outputs.version }}"

  github-release:
    name: Release GitHub
    # Uniquement sur un push de tag : un dispatch manuel vérifie et publie, mais
    # ne crée pas de release (pas de tag à rattacher).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extraire le corps depuis le CHANGELOG
        id: corps
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          FICHIER=$(mktemp)
          # Section `## [X.Y.Z]` (préfixe exact, le `]` évite 0.1 vs 0.1.1)
          # jusqu'au prochain titre `## `.
          if awk -v cible="## [$V]" \
            'index($0, cible) == 1 {dans=1; next} dans && /^## / {exit} dans {print}' \
            CHANGELOG.md > "$FICHIER" && [ -s "$FICHIER" ]; then
            echo "section CHANGELOG trouvée pour [$V]"
          else
            echo "section [$V] absente du CHANGELOG.md — corps de repli" >&2
            printf 'Version %s — voir [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md).\n' \
              "$V" "$GITHUB_REPOSITORY" > "$FICHIER"
          fi
          echo "path=$FICHIER" >> "$GITHUB_OUTPUT"

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: swarm-control ${{ github.ref_name }}
          body_path: ${{ steps.corps.outputs.path }}
          draft: false
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}

  binaries:
    name: Binaire (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, github-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Serveurs ARM (Raspberry Pi, VPS Ampere) : runner ARM natif, pas de cross-link.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # macOS Intel : cross-build depuis le runner ARM (SDK universel).
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Compiler (release)
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Empaqueter + sommes SHA-256
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          NAME="swarm-control-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$NAME"
          cp LICENSE-MIT LICENSE-APACHE README.md CHANGELOG.md "$NAME/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/swarm-control.exe" "$NAME/"
            cp "target/${{ matrix.target }}/release/swarm-control.exe" "$NAME.exe"
            EXE="$NAME.exe"
            7z a -tzip "$NAME.zip" "$NAME" >/dev/null
            ARCHIVE="$NAME.zip"
          else
            cp "target/${{ matrix.target }}/release/swarm-control" "$NAME/"
            cp "target/${{ matrix.target }}/release/swarm-control" "$NAME"
            EXE="$NAME"
            tar -czf "$NAME.tar.gz" "$NAME"
            ARCHIVE="$NAME.tar.gz"
          fi
          somme() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" > "$1.sha256"
            else shasum -a 256 "$1" > "$1.sha256"; fi
          }
          somme "$ARCHIVE"
          somme "$EXE"
          # Copie sous nom fixe sans version : le permalien releases/latest/download
          # reste valide d'une version à l'autre (posts Discord, scripts d'install).
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) ALIAS="swarm-control-linux-x86_64" ;;
            aarch64-unknown-linux-gnu) ALIAS="swarm-control-linux-aarch64" ;;
            aarch64-apple-darwin) ALIAS="swarm-control-macos-aarch64" ;;
            x86_64-apple-darwin) ALIAS="swarm-control-macos-x86_64" ;;
            x86_64-pc-windows-msvc) ALIAS="swarm-control-windows-x86_64.exe" ;;
          esac
          cp "$EXE" "$ALIAS"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"

      - name: Joindre à la release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.pack.outputs.archive }}
            ${{ steps.pack.outputs.archive }}.sha256
            ${{ steps.pack.outputs.exe }}
            ${{ steps.pack.outputs.exe }}.sha256
            ${{ steps.pack.outputs.alias }}
